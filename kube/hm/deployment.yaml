apiVersion: apps/v1
kind: Deployment
metadata:
  name: hm
  namespace: fleet
  labels:
    app.kubernetes.io/name: hm
    app.kubernetes.io/part-of: fleet
spec:
  # one hm governs the whole mesh today (RFC declaration 6); its consumer
  # group would tolerate replicas, but the ledger is in-memory in v0 so a
  # second replica would just split the observations
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hm
  template:
    metadata:
      # Opt in to Prometheus scraping. hm has emitted the exposition format on
      # its control port since it was written -- hm_void_topics_total,
      # hm_records_total, hm_introspect_ticks_total, hm_topics_subscribed_total
      # -- and until 2026-08-20 nothing in this fleet scraped anything at all,
      # so those series went nowhere.
      #
      # This matters more for hm than for most services. hm's whole purpose is
      # the absence ledger: producers with no live consumers, heartbeats that
      # stopped, replies that never came. It found `observability.events`
      # producing into the void and said so at refusal level every 55 seconds
      # for 116 consecutive ticks -- into a container log nobody tails. A
      # finding nobody receives is not a finding, and the founding story in the
      # README (a week of producers emitting to topics nothing consumed, every
      # artifact gate green) had quietly repeated itself with hm running.
      #
      # This annotation is the opt-in the prometheus fleet-services job keys
      # on. No code change: the metrics were always there.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: hm
        app.kubernetes.io/part-of: fleet
    spec:
      serviceAccountName: hm
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: hm
          # locally built, imported into k3d by name; same convention as the
          # rest of the fleet's local images
          image: hall-monitor-hm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: control
              containerPort: 8090
          env:
            - name: HM_KAFKA_BROKERS
              value: "kafka:9092"
            - name: HM_SCHEMA_REGISTRY_URL
              value: "http://schema-registry:8081"
            - name: HM_HTTP_ADDR
              value: ":8090"
          # liveness only: a degraded hm (broker gone mid-flight) must stay
          # up and KEEP SAYING degraded -- restarting it would be the
          # present-uncertain-state-as-truth failure with extra steps
          livenessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
